<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="262"><style>@keyframes km-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } } @keyframes km-shadow { 0%, 100% { transform: scaleX(1); opacity: 0.16; } 50% { transform: scaleX(0.94); opacity: 0.11; } } @keyframes km-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.06); } } @keyframes km-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } } @keyframes km-tilt { 0%, 100% { transform: rotate(0deg); } 60% { transform: rotate(-2deg); } } @keyframes km-sleeve { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2.5deg); } } @keyframes km-twitch { 0%, 84%, 100% { transform: rotate(0deg); } 88% { transform: rotate(-8deg); } 92% { transform: rotate(3deg); } } @keyframes km-fan { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(5deg); } } @keyframes km-petal { 0% { transform: translate(0, -14px) rotate(0deg); opacity: 0; } 10% { opacity: 0.9; } 85% { opacity: 0.9; } 100% { transform: translate(-34px, 250px) rotate(290deg); opacity: 0; } } .km-bob { animation: km-bob 3.6s ease-in-out infinite; } .km-shadow { animation: km-shadow 3.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; } .km-blink { animation: km-blink 4.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; } .km-sway { animation: km-sway 3.2s ease-in-out infinite; transform-origin: 50% 100%; transform-box: fill-box; } .km-tilt { animation: km-tilt 5s ease-in-out infinite; transform-origin: 50% 90%; transform-box: fill-box; } .km-sleeve { animation: km-sleeve 3.6s ease-in-out infinite; transform-origin: 80% 10%; transform-box: fill-box; } .km-twitch { animation: km-twitch 6s ease-in-out infinite; transform-origin: 50% 100%; transform-box: fill-box; } .km-fan { animation: km-fan 3s ease-in-out infinite; transform-origin: 10% 90%; transform-box: fill-box; } .km-bob { animation-duration: 1.8s; } .km-shadow { animation-duration: 1.8s; } .km-fan { animation-duration: 1.6s; }</style>
