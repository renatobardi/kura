name: kurad release

# Publishes a downloadable `kurad` binary for the LXC deploy scripts in
# deploy/kura-daemon-lxd/ (see 03-kurad.sh) — there is no other artifact-
# publish path for server binaries today: docker.yml only builds+publishes
# the relay image, and the "Server Cross-Compile" job in ci.yml only
# compiles/tests kura-acp/kura-agent/kura-dev-mcp/git-credential-nostr/
# git-sign-nostr/kurad in CI, it never uploads anything.
#
# Deliberately manual (workflow_dispatch only, no tag or push trigger) and a
# single ROLLING release (tag `kurad-latest`, asset re-uploaded with
# --clobber each run) rather than the versioned release-PR lane desktop and
# the relay use (see Justfile `release-desktop`/`release-relay`): `kurad` has
# no independent version file the way kura-relay does (its Cargo.toml is
# `version.workspace = true`), and it is an internal ops binary for the
# oute-server LXC, not a product surface with its own release cadence yet.
# Wire this to `push: branches: [main]` (paths: crates/kurad/**,
# crates/kura-host/**) once `kurad` needs to track main automatically instead
# of being cut on demand.
#
# Deliberately NOT `releases/latest/download/...`: GitHub's "latest release"
# is repo-wide, shared with desktop's and mobile's release tags — a future
# desktop release would silently become "latest" and break 03-kurad.sh's
# download URL. A fixed `kurad-latest` tag is immune to that.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RELEASE_TAG: kurad-latest

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: cross-${{ matrix.target }}
          save-if: false
      - name: Install cross
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cross@0.2.5
      # Same tool/version/target-triple as the "Server Cross-Compile" job in
      # ci.yml (kept in sync by hand — see that job's comment for why `cross`
      # and musl, not gnu).
      - name: Build kurad (release)
        env:
          TARGET: ${{ matrix.target }}
        run: cross build --release --target "$TARGET" -p kurad
      - name: Rename binary to its target-qualified asset name
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/kurad" "dist/kurad-$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kurad-${{ matrix.target }}
          path: dist/kurad-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    permissions:
      contents: write # gh release create/upload
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kurad-*
          path: dist
          merge-multiple: true
      - name: List downloaded assets
        run: ls -la dist/
      - name: Create the rolling release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && exit 0
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "kurad (rolling)" \
            --notes "Rolling build of the \`kurad\` headless daemon for the oute-server LXC deploy scripts (deploy/kura-daemon-lxd/). Not a versioned product release — re-run this workflow to refresh." \
            --target "${{ github.sha }}"
      - name: Upload the built binaries, replacing any existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/kurad-* --repo "${{ github.repository }}" --clobber
