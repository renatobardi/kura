services:
  relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      KURA_DOMAIN: ${KURA_DOMAIN:?set KURA_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - kura-caddy-data:/data
      - kura-caddy-config:/config
    restart: unless-stopped
    networks:
      - kura-net

volumes:
  kura-caddy-data:
    labels:
      com.kura.volume: caddy-data
  kura-caddy-config:
    labels:
      com.kura.volume: caddy-config
