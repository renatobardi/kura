# Sample Secret matching `secrets.existingSecret: kura-secrets`.
#
# Manage this via SealedSecrets / SOPS / External Secrets / Vault — anything
# that keeps the unencrypted form out of git. The chart reads keys it finds
# and leaves the rest as Pod env vars marked `optional: true`.
#
# Keys consumed by the relay (all optional unless required by relay config):
#   KURA_RELAY_PRIVATE_KEY        — 64-char hex; relay identity (do NOT rotate)
#   KURA_GIT_HOOK_HMAC_SECRET     — 32+ chars; required when replicaCount > 1
#   DATABASE_URL                  — postgres://...
#   READ_DATABASE_URL             — postgres://... (optional read-replica; omit to disable read routing)
#   REDIS_URL                     — redis://...  (required when replicaCount > 1)
#   KURA_S3_ACCESS_KEY
#   KURA_S3_SECRET_KEY
#   KURA_KLIPY_API_KEY            — omit to disable relay-proxied GIF search
apiVersion: v1
kind: Secret
metadata:
  name: kura-secrets
  namespace: kura
type: Opaque
stringData:
  KURA_RELAY_PRIVATE_KEY: "REPLACE_WITH_64_HEX"
  KURA_GIT_HOOK_HMAC_SECRET: "REPLACE_WITH_RANDOM_64_CHARS"
  DATABASE_URL: "postgres://kura:REPLACE@postgres.kura.svc.cluster.local:5432/kura?sslmode=require"
  REDIS_URL: "redis://:REPLACE@redis.kura.svc.cluster.local:6379"
  KURA_S3_ACCESS_KEY: "REPLACE"
  KURA_S3_SECRET_KEY: "REPLACE"
  KURA_KLIPY_API_KEY: "REPLACE"
